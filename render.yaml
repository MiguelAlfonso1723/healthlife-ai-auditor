services:
  - type: web
    name: healthlife-api
    runtime: python
    plan: free

    buildCommand: |
      python3.11 -m pip install --upgrade pip
      python3.11 -m pip install -r requirements.txt

    startCommand: |
      uvicorn src.api:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
